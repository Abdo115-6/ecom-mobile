version: '3.9'

services:
  # ------------------------------------------------------------
  # 1. Reverse Proxy / Gateway
  # ------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: aura_nginx_gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - aura_net

  # ------------------------------------------------------------
  # 2. Frontend (Next.js / Vite Mobile Storefront & Admin)
  # ------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aura_frontend
    environment:
      - NODE_ENV=production
      - VITE_API_BASE_URL=http://backend:8080/api/v1
    ports:
      - "3000:3000"
    restart: unless-stopped
    networks:
      - aura_net

  # ------------------------------------------------------------
  # 3. Backend (Java 21 / Spring Boot 3 API)
  # ------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aura_backend_api
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATABASE_URL=jdbc:postgresql://postgres:5432/ecommerce_db
      - DATABASE_USERNAME=postgres_user
      - DATABASE_PASSWORD=SuperSecurePostgresPassword2026!
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=SecureRedisAuthToken2026!
      - JWT_SECRET=c2VjdXJlX2p3dF9zaWduaW5nX2tleV9mb3JfYXVyYV9lY29tbWVyY2VfcGxhdGZvcm1fMjAyNg==
      - STORAGE_ENDPOINT=http://minio:9000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - aura_net

  # ------------------------------------------------------------
  # 4. Relational Database (PostgreSQL 16)
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: aura_postgres
    environment:
      - POSTGRES_DB=ecommerce_db
      - POSTGRES_USER=postgres_user
      - POSTGRES_PASSWORD=SuperSecurePostgresPassword2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - aura_net

  # ------------------------------------------------------------
  # 5. In-Memory Cache & Session Store (Redis 7)
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aura_redis
    command: redis-server --requirepass SecureRedisAuthToken2026! --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "SecureRedisAuthToken2026!", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - aura_net

  # ------------------------------------------------------------
  # 6. Object Storage (MinIO S3 Compatible for Product Media)
  # ------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-03-30T09-41-56Z
    container_name: aura_minio_storage
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minio_access_key
      - MINIO_ROOT_PASSWORD=minio_secret_password_key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped
    networks:
      - aura_net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  aura_net:
    driver: bridge
