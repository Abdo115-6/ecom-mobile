    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "OnlineStore",
      "name": "ShopMe Maroc",
      "description": "Boutique en ligne officielle ShopMe Maroc. Mode, parfumerie et accessoires avec paiement à la livraison",
      "currenciesAccepted": "MAD, EUR, USD",
      "paymentAccepted": "Cash on Delivery, Credit Card",
      "priceRange": "$$",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-slate-900 selection:text-white">
